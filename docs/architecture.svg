<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">SysRail architecture</title>
  <desc id="desc">An AI agent speaks MCP over stdio to sysrail mcp, an unprivileged proxy that forwards calls over a Unix socket with a token to the sysrail daemon. The sandboxed daemon checks policy, waits for a human approval when policy says ask, writes the audit log before anything runs, and executes providers. Providers read /proc and /sys, manage systemd over D-Bus as authorized by polkit, read journald and query GPUs. An administrator approves requests with sudo sysrail approvals over a private admin socket.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #d0d7de; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 15px; font-weight: 600; }
      .h2 { font-size: 13.5px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #656d76; }
      .lbl { font-size: 11px; fill: #57606a; }
      .zl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #656d76; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #656d76; }
      .note { font-size: 13px; fill: #1f2328; }
      .zone { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .agent { fill: #fff8e5; stroke: #d4a72c; stroke-width: 1.4; }
      .shim { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.4; }
      .daemon { fill: #f1f7ff; stroke: #0969da; stroke-width: 1.6; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
      .person { fill: #effbf2; stroke: #1a7f37; stroke-width: 1.4; }
      .host { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1.2; }
      .line { fill: none; stroke: #57606a; stroke-width: 1.6; }
      .head { fill: #57606a; }
      .policy { fill: #8250df; }
      .approve { fill: #bf8700; }
      .audit { fill: #1a7f37; }
      .prov { fill: #0969da; }
      .check { fill: #1a7f37; }
      .checkmark { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .badge { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
      .badget { font-size: 11px; font-weight: 600; fill: #cf222e; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; stroke: #30363d; }
        text, .note { fill: #e6edf3; }
        .s, .zl, .mono { fill: #8b949e; }
        .lbl { fill: #9198a1; }
        .zone { stroke: #6e7681; }
        .agent { fill: #2a2112; stroke: #bb8009; }
        .shim { fill: #161b22; stroke: #6e7681; }
        .daemon { fill: #0b1a2e; stroke: #388bfd; }
        .card { fill: #161b22; stroke: #30363d; }
        .person { fill: #0f2418; stroke: #2ea043; }
        .host { fill: #161b22; stroke: #484f58; }
        .line { stroke: #8b949e; }
        .head { fill: #8b949e; }
        .policy { fill: #a371f7; }
        .approve { fill: #d29922; }
        .audit, .check { fill: #3fb950; }
        .prov { fill: #4493f8; }
        .checkmark { stroke: #0d1117; }
        .badge { fill: #3d1416; stroke: #f85149; }
        .badget { fill: #ff7b72; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="559" rx="14"/>

  <!-- Agent side: runs as the agent's user and is untrusted -->
  <rect class="zone" x="26" y="56" width="366" height="150" rx="12"/>
  <text class="zl" x="42" y="78">AGENT USER · UNTRUSTED</text>

  <rect class="agent" x="40" y="95" width="150" height="70" rx="10"/>
  <text class="h" x="115" y="126" text-anchor="middle">AI agent</text>
  <text class="s" x="115" y="145" text-anchor="middle">OpenCode, Claude Code</text>

  <rect class="shim" x="236" y="95" width="146" height="70" rx="10"/>
  <text class="h" x="309" y="122" text-anchor="middle">sysrail mcp</text>
  <text class="s" x="309" y="140" text-anchor="middle">stdio proxy</text>
  <text class="s" x="309" y="155" text-anchor="middle">no privileges</text>

  <path class="line" d="M190,130 H234" marker-end="url(#arrow)"/>
  <text class="lbl" x="212" y="122" text-anchor="middle">MCP</text>
  <text class="lbl" x="212" y="146" text-anchor="middle">stdio</text>

  <!-- Daemon -->
  <rect class="daemon" x="470" y="36" width="252" height="372" rx="14"/>
  <text class="h" x="490" y="63">sysrail daemon</text>
  <text class="s" x="490" y="81">sandboxed · no capabilities</text>

  <path class="line" d="M382,130 H488" marker-end="url(#arrow)"/>
  <text class="lbl" x="431" y="122" text-anchor="middle">Unix socket</text>
  <text class="lbl" x="431" y="146" text-anchor="middle">+ token</text>

  <rect class="card" x="490" y="104" width="212" height="52" rx="9"/>
  <circle class="policy" cx="510" cy="130" r="6"/>
  <text class="h2" x="526" y="126">Policy</text>
  <text class="s" x="526" y="143">allow · ask · deny</text>

  <rect class="card" x="490" y="178" width="212" height="52" rx="9"/>
  <circle class="approve" cx="510" cy="204" r="6"/>
  <text class="h2" x="526" y="200">Approvals</text>
  <text class="s" x="526" y="217">a human decides</text>

  <rect class="card" x="490" y="252" width="212" height="52" rx="9"/>
  <circle class="audit" cx="510" cy="278" r="6"/>
  <text class="h2" x="526" y="274">Audit log</text>
  <text class="s" x="526" y="291">SQLite · append-only</text>

  <rect class="card" x="490" y="326" width="212" height="52" rx="9"/>
  <circle class="prov" cx="510" cy="352" r="6"/>
  <text class="h2" x="526" y="348">Providers</text>
  <text class="s" x="526" y="365">linux · systemd</text>

  <path class="line" d="M510,156 V176" marker-end="url(#arrow)"/>
  <text class="lbl" x="522" y="170">if ask</text>
  <path class="line" d="M510,230 V250" marker-end="url(#arrow)"/>
  <path class="line" d="M510,304 V324" marker-end="url(#arrow)"/>
  <text class="lbl" x="522" y="318">audited before it runs</text>

  <!-- Administrator -->
  <rect class="person" x="802" y="165" width="136" height="78" rx="10"/>
  <text class="h2" x="870" y="193" text-anchor="middle">Administrator</text>
  <text class="mono" x="870" y="212" text-anchor="middle">sudo sysrail</text>
  <text class="mono" x="870" y="227" text-anchor="middle">approvals</text>

  <path class="line" d="M802,204 H704" marker-end="url(#arrow)"/>
  <text class="lbl" x="762" y="196" text-anchor="middle">admin socket</text>
  <text class="lbl" x="762" y="219" text-anchor="middle">mode 0600</text>

  <!-- Key properties -->
  <circle class="check" cx="50" cy="258" r="8"/>
  <path class="checkmark" d="M46.5,258.2 L49,260.8 L53.8,255.4"/>
  <text class="note" x="66" y="262.5">No shell, no root, no Docker socket</text>
  <circle class="check" cx="50" cy="288" r="8"/>
  <path class="checkmark" d="M46.5,288.2 L49,290.8 L53.8,285.4"/>
  <text class="note" x="66" y="292.5">Changes can wait for a human</text>
  <circle class="check" cx="50" cy="318" r="8"/>
  <path class="checkmark" d="M46.5,318.2 L49,320.8 L53.8,315.4"/>
  <text class="note" x="66" y="322.5">Every call is audited before it runs</text>

  <!-- Host: providers fan out over a bus; systemd changes pass polkit -->
  <rect class="zone" x="24" y="466" width="914" height="80" rx="12"/>
  <text class="zl" x="40" y="485">HOST OS</text>

  <path class="line" d="M595,378 V428 M138,428 H824"/>
  <path class="line" d="M138,428 V492" marker-end="url(#arrow)"/>
  <path class="line" d="M367,428 V492" marker-end="url(#arrow)"/>
  <path class="line" d="M595,428 V492" marker-end="url(#arrow)"/>
  <path class="line" d="M824,428 V492" marker-end="url(#arrow)"/>

  <rect class="badge" x="339" y="437" width="56" height="20" rx="10"/>
  <text class="badget" x="367" y="451" text-anchor="middle">polkit</text>

  <rect class="host" x="40" y="494" width="196" height="38" rx="8"/>
  <text class="h2" x="138" y="518" text-anchor="middle">/proc · /sys</text>
  <rect class="host" x="269" y="494" width="196" height="38" rx="8"/>
  <text class="h2" x="367" y="518" text-anchor="middle">systemd · D-Bus</text>
  <rect class="host" x="497" y="494" width="196" height="38" rx="8"/>
  <text class="h2" x="595" y="518" text-anchor="middle">journald</text>
  <rect class="host" x="726" y="494" width="196" height="38" rx="8"/>
  <text class="h2" x="824" y="518" text-anchor="middle">nvidia-smi · sysfs</text>
</svg>
