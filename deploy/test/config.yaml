# Test-host configuration installed by scripts/deploy-remote.sh.
# Token hashes are substituted at deploy time.
server:
  http_listen: 127.0.0.1:9487
  agent_socket: /run/sysrail/agent.sock
  agent_socket_group: sysrail-agents
  admin_socket: /run/sysrail/admin.sock
database: /var/lib/sysrail/sysrail.db
policy_file: /etc/sysrail/policy.yaml
approvals:
  ttl: 5m
agents:
  e2e:
    token_sha256: "@E2E_HASH@"
    limits:
      calls_per_minute: 6000
      burst: 1000
  e2e-readonly:
    token_sha256: "@E2E_READONLY_HASH@"
  e2e-ratelimit:
    token_sha256: "@E2E_RATELIMIT_HASH@"
    limits:
      calls_per_minute: 6
      burst: 3
  e2e-pending:
    token_sha256: "@E2E_PENDING_HASH@"
    limits:
      calls_per_minute: 0
      max_pending: 2
# Local receivers started by test/e2e (TestNotifications).
notifications:
  webhooks:
    - url: http://127.0.0.1:19801/hook
  ntfy:
    - url: http://127.0.0.1:19802/sysrail-e2e
  telegram:
    - bot_token: "123:E2E"
      chat_id: "42"
      api_url: http://127.0.0.1:19803
  email:
    - smtp_host: 127.0.0.1
      smtp_port: 19825
      tls: none
      from: SysRail <sysrail@test.invalid>
      to: [admin@test.invalid]
log:
  level: debug
